# =============================================================================
# Пример TOML-конфигурации ACME + FastVPS FastDNS.
# Скопируйте в /etc/certbot-dns/config.toml или укажите: certs-acme -config /path/to/config.toml
# =============================================================================
#
# Домены и зона: поле zone в конфиге не используется — зона FastDNS для API выводится как
# «последние две метки» имени (host.example.com → example.com; *.server.raidkon.com → raidkon.com).
# Проверка GetRecords выполняется один раз на каждую уникальную такую зону. Подробнее — [[certificates]].domains.
#
# =============================================================================

# -----------------------------------------------------------------------------
# [acme] — учётная запись и каталог Let's Encrypt
# -----------------------------------------------------------------------------

[acme]
# Контактный email для регистрации ACME (Let's Encrypt может слать уведомления).
email = "admin@example.com"
# Каталог ЦС: "production" — боевой LE (доверенные сертификаты); "staging" — тестовый LE (не доверяют браузеры).
directory = "production"
# Каталог для account.key (EC P-256 ключ ACME-аккаунта) и registration.json.
state_dir = ".acme-state"
# Необязательно. Строка User-Agent в запросах к ACME; если пусто — встроенное значение в бинарнике.
# user_agent = "certbot-dns/1"

# -----------------------------------------------------------------------------
# [fastdns] — API FastVPS FastDNS (DNS-01)
# -----------------------------------------------------------------------------

[fastdns]
# Токен авторизации FastDNS. Рекомендуется ${FASTDNS_API_TOKEN} из окружения, не хранить секрет в git.
api_token = "${FASTDNS_API_TOKEN}"
# Необязательно. Базовый URL API; если пусто — используется адрес по умолчанию в клиенте (fastdns.fv.ee).
# api_url = ""
# DNS-01 для FastDNS выполняется последовательно (одна TXT за раз): у API часто нельзя два
# параллельных AppendRecords на одно имя (_acme-challenge при сертификате *.domain + domain).
# Перед каждым Present удаляются старые TXT с тем же именем в зоне (остатки сорванных выпусков).

# -----------------------------------------------------------------------------
# [dns_challenge] — ожидание распространения TXT перед проверкой у ЦС
# -----------------------------------------------------------------------------

[dns_challenge]
# Максимальное суммарное время ожидания появления TXT (синтаксис Go: 24h, 90m, 1h30m).
propagation_timeout = "24h"
# Пауза между опросами DNS (и первая пауза перед первой проверкой внутри lego).
propagation_interval = "10m"
# Рекурсивные резолверы "host:port" для pre-check: «виден ли TXT в DNS» до запроса к Let's Encrypt.
# Если не задано, приложение само использует 8.8.8.8 и 1.1.1.1 — так надёжнее, чем только 127.0.0.53
# из /etc/resolv.conf (systemd-resolved часто кэширует и не совпадает с тем, что видит ЦС).
# Явно задайте свои резолверы в закрытой сети, например: recursive_resolvers = ["10.0.0.1:53"]
# recursive_resolvers = ["8.8.8.8:53", "1.1.1.1:53"]

# -----------------------------------------------------------------------------
# [[certificates]] — один блок: один список domains → несколько выпусков и подпапок
# -----------------------------------------------------------------------------

[[certificates]]
# Произвольная метка для логов (если пусто — в логах будет #0, #1, … по порядку блоков).
id = "sites"
# Список доменов: wildcard *.a.b даёт SAN *.a.b + a.b; только c.d без *.c.d — отдельный apex-сертификат;
# имя на один уровень под *.apex попадает в ту же wildcard-группу. Несколько *. — несколько wc-* каталогов.
# Зона FastDNS для DNS-01: последние две метки apex (для поддоменов той же «корневой» зоны в панели).
domains = ["*.example.com"]
# Базовый каталог: внутри wc-* / apex-* — каталоги YYYY-MM-DD (fullchain, privkey, issuer), symlink live -> актуальная дата.
# При прерывании выпуска в этом каталоге может появиться .obtain-checkpoint.json — по нему
# при следующем запуске продолжится тот же заказ ACME (те же TXT в FastDNS, без нового заказа).
output_dir = "./out/sites"
# Алгоритм ключа сертификата: ec256 | ec384 | rsa2048 | rsa3072 | rsa4096 | rsa8192.
key_type = "ec256"
# За сколько календарных дней до NotAfter перевыпускать (или если нет fullchain по пути live/ или legacy).
renew_before_days = 25

# -----------------------------------------------------------------------------
# [runtime] — режим процесса и логирование
# -----------------------------------------------------------------------------

[runtime]
# "once" — один проход (проверка сроков, выпуск при необходимости) и выход процесса.
# "daemon" — бесконечный цикл: сон до следующей проверки или срока продления.
mode = "once"
# В режиме daemon: если все сертификаты свежие, не спать дольше этого без повторной проверки файлов на диске.
poll_when_ok = "24h"
# Уровень логов в stdout: debug | verbose | info | warning | error | fatal.
# debug — максимум сообщений + файл:строка в логе; verbose — то же по фильтру, без file:line;
# info — штатная работа; warning / error / fatal — только более важные сообщения (fatal — критические + exit).
loglevel = "info"

